
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loose Collect</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f4f8;color:#15213b;font-family:Arial,sans-serif}
header{background:#111827;color:white;padding:26px 18px}
h1{margin:0;font-size:30px}
header p{color:#aebbd0}
main{max-width:1000px;margin:auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:white;border-radius:14px;padding:16px 5px;text-align:center}
.stat strong{display:block;font-size:23px}
.stat span{font-size:12px;color:#64748b}
input{width:100%;padding:17px;border:1px solid #ccd5e3;border-radius:12px;font-size:16px;margin:18px 0 12px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
button{padding:12px;border:1px solid #ccd5e3;background:white;border-radius:10px;font-weight:bold;color:#15213b}
button.active{background:#1c315b;color:white}
#status{margin:18px 0;color:#64748b}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:white;border-radius:14px;padding:12px;overflow:hidden}
.card img{width:100%;aspect-ratio:2.5/3.5;object-fit:contain;background:#f1f5f9;border-radius:8px}
.card h3{margin:10px 0 5px;font-size:17px}
.card p{font-size:13px;color:#64748b;margin:5px 0}
.price{font-weight:bold;font-size:18px;margin-top:10px}
footer{padding:30px 18px;color:#64748b;font-size:12px;text-align:center}
</style>
</head>
<body>
<header>
<h1>LOOSE COLLECT</h1>
<p>Mon classeur Pokémon · Consultation</p>
</header>
<main>
<div class="stats">
<div class="stat"><strong id="refs">—</strong><span>Références</span></div>
<div class="stat"><strong id="total">—</strong><span>Cartes</span></div>
<div class="stat"><strong id="value">—</strong><span>Valeur CHF</span></div>
</div>

<input id="search" placeholder="🔎 Pokémon, numéro, série...">

<div class="filters">
<button class="active" data-filter="all">Toutes</button>
<button data-filter="fr">Français</button>
<button data-filter="duplicates">Doublons</button>
</div>

<p id="status">Chargement des cartes...</p>
<div class="cards" id="cards"></div>
</main>
<footer>
Prix indicatifs en CHF, non actualisés.
Les modifications dans Supabase apparaissent après actualisation.
</footer>

<script>
const SUPABASE_URL =
"https://iajlrvudypqzcfiwdcyt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_B5LSj-zXH3A1eo9flE0flQ_RsRlD7-F";

const TABLE = "loose_collect_cards";

let inventory = [];
let filter = "all";

const $ = id => document.getElementById(id);

function field(obj,names,fallback=""){
  for(const name of names){
    if(obj[name] !== undefined && obj[name] !== null)
      return obj[name];
  }
  return fallback;
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function normalize(row){
  return {
    name:field(row,["name","nom","pokemon","card_name"],"Sans nom"),
    number:field(row,["number","numero","card_number"],""),
    language:field(row,["language","langue","lang"],""),
    set:field(row,["set_name","serie","set","series"],""),
    variant:field(row,["variant","variante","rarity","rarete"],""),
    quantity:Number(field(row,["quantity","quantite","qty"],1))||0,
    price:Number(field(row,["price_chf","prix_chf","unit_price","price","prix"],0))||0,
    image:field(row,["image_url","image","photo_url","photo"],"")
  };
}

function render(){
  const query=$("search").value.toLowerCase().trim();

  let visible=inventory.filter(c=>{
    const matches=[
      c.name,c.number,c.set,c.language,c.variant
    ].join(" ").toLowerCase().includes(query);

    if(!matches)return false;
    if(filter==="fr")
      return c.language.toUpperCase()==="FR";
    if(filter==="duplicates")
      return c.quantity>1;
    return true;
  });

  $("refs").textContent=inventory.length;
  $("total").textContent=inventory.reduce((s,c)=>s+c.quantity,0);
  $("value").textContent=inventory.reduce(
    (s,c)=>s+c.quantity*c.price,0
  ).toFixed(2);

  $("status").textContent=visible.length+" référence(s) affichée(s)";

  $("cards").innerHTML=visible.map(c=>`
    <article class="card">
      ${c.image
        ? `<img src="${escapeHTML(c.image)}" alt="${escapeHTML(c.name)}" loading="lazy" onerror="this.style.display='none'">`
        : `<div style="height:140px;background:#e9edf5;border-radius:8px;display:grid;place-items:center;color:#64748b">Image indisponible</div>`
      }
      <h3>${escapeHTML(c.name)}</h3>
      <p>${escapeHTML(c.number)} · ${escapeHTML(c.language)}</p>
      <p>${escapeHTML(c.set)}</p>
      <p>${escapeHTML(c.variant)}</p>
      <p>Quantité : ${c.quantity}</p>
      <div class="price">${c.price.toFixed(2)} CHF</div>
    </article>
  `).join("");
}

async function loadCards(){
  try{
    const response=await fetch(
      SUPABASE_URL+"/rest/v1/"+TABLE+"?select=*",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY
        }
      }
    );

    if(!response.ok){
      const detail=await response.text();
      throw new Error("HTTP "+response.status+" : "+detail.slice(0,250));
    }

    const data=await response.json();

    if(!Array.isArray(data))
      throw new Error("Réponse inattendue de Supabase");

    inventory=data.map(normalize);
    render();

    if(!inventory.length){
      $("status").textContent=
        "La connexion fonctionne, mais la table ne contient aucune carte visible.";
    }

  }catch(error){
    $("status").textContent=
      "Erreur de connexion : "+error.message;
  }
}

$("search").addEventListener("input",render);

document.querySelectorAll("[data-filter]").forEach(button=>{
  button.addEventListener("click",()=>{
    filter=button.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(
      b=>b.classList.toggle("active",b===button)
    );
    render();
  });
});

loadCards();
</script>
</body>
</html>
